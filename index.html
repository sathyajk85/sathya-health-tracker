<!-- FIREBASE MODULAR SDK & APPLICATION LOGIC -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

    // Your Exact Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyCJx6QJJsLVVX0Q4tvEhxQioYFfX-yT49A",
      authDomain: "sathya-health-tracker.firebaseapp.com",
      projectId: "sathya-health-tracker",
      storageBucket: "sathya-health-tracker.firebasestorage.app",
      messagingSenderId: "490303020596",
      appId: "1:490303020596:web:d4ee3193a5c296b1e33461"
    };

    // Initialize Firebase & Cloud Firestore
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const DATA_DOC_REF = doc(db, "userData", "sathya_main_record");

    // Default Settings (API Key set via Settings UI)
    const DEFAULT_SETTINGS = {
      mode: 'dynamic',
      bmr: 1612,
      stepFactor: 0.044,
      proteinGoal: 150,
      fixedBudget: 1900,
      geminiApiKey: '',
      strengthKcalPerMin: 6.5,
      swimKcalPerMin: 8.5,
      otherKcalPerMin: 5.0
    };

    let settings = JSON.parse(localStorage.getItem('app_settings')) || DEFAULT_SETTINGS;
    let appData = JSON.parse(localStorage.getItem('health_app_data')) || {};
    let selectedDate = new Date().toISOString().split('T')[0];

    function ensureDateRecord(dateStr) {
      if (!appData[dateStr]) {
        appData[dateStr] = {
          metrics: { weight: null, fat: null, muscle: null, steps: 0 },
          meals: [],
          workouts: []
        };
      }
      return appData[dateStr];
    }

    // Save locally AND sync automatically to Cloud Firestore
    async function saveAppData() {
      localStorage.setItem('health_app_data', JSON.stringify(appData));
      renderCurrentDateView();
      try {
        await setDoc(DATA_DOC_REF, { data: appData, settings: settings }, { merge: true });
      } catch (err) {
        console.error("Cloud sync error:", err);
      }
    }

    // Real-Time Cloud Listener
    onSnapshot(DATA_DOC_REF, (docSnap) => {
      if (docSnap.exists()) {
        const cloudPayload = docSnap.data();
        if (cloudPayload.data) {
          appData = cloudPayload.data;
          localStorage.setItem('health_app_data', JSON.stringify(appData));
        }
        if (cloudPayload.settings) {
          settings = Object.assign({}, DEFAULT_SETTINGS, cloudPayload.settings);
          localStorage.setItem('app_settings', JSON.stringify(settings));
        }
        renderCurrentDateView();
      }
    });

    // UI Tab Navigation
    const tabs = document.querySelectorAll('.nav-tab');
    tabs.forEach(btn => {
      btn.addEventListener('click', () => {
        tabs.forEach(b => {
          b.classList.remove('text-emerald-400');
          b.classList.add('text-slate-400');
        });
        btn.classList.remove('text-slate-400');
        btn.classList.add('text-emerald-400');

        document.getElementById('tabDashboard').classList.add('hidden');
        document.getElementById('tabMeals').classList.add('hidden');
        document.getElementById('tabExercise').classList.add('hidden');

        const target = btn.getAttribute('data-target');
        document.getElementById(target).classList.remove('hidden');
      });
    });

    // Date Picker Controls
    const datePicker = document.getElementById('datePicker');
    datePicker.value = selectedDate;

    datePicker.addEventListener('change', (e) => {
      selectedDate = e.target.value;
      renderCurrentDateView();
    });

    document.getElementById('prevDateBtn').addEventListener('click', () => {
      const d = new Date(selectedDate);
      d.setDate(d.getDate() - 1);
      selectedDate = d.toISOString().split('T')[0];
      datePicker.value = selectedDate;
      renderCurrentDateView();
    });

    document.getElementById('nextDateBtn').addEventListener('click', () => {
      const d = new Date(selectedDate);
      d.setDate(d.getDate() + 1);
      selectedDate = d.toISOString().split('T')[0];
      datePicker.value = selectedDate;
      renderCurrentDateView();
    });

    document.getElementById('todayBtn').addEventListener('click', () => {
      selectedDate = new Date().toISOString().split('T')[0];
      datePicker.value = selectedDate;
      renderCurrentDateView();
    });

    // Modals Setup
    function setupModal(triggerBtnId, modalId) {
      const modal = document.getElementById(modalId);
      const btn = document.getElementById(triggerBtnId);
      if (btn) btn.addEventListener('click', () => modal.classList.remove('hidden'));
      modal.querySelectorAll('.closeModalBtn').forEach(close => {
        close.addEventListener('click', () => modal.classList.add('hidden'));
      });
      modal.addEventListener('click', (e) => {
        if (e.target === modal) modal.classList.add('hidden');
      });
    }

    setupModal('openMealModalBtn', 'mealModal');
    setupModal('openWorkoutModalBtn', 'workoutModal');
    setupModal('openMetricsModalBtn', 'metricsModal');
    setupModal('editStepsBtn', 'metricsModal');
    setupModal('settingsBtn', 'settingsModal');

    document.getElementById('openMealModalBtn').addEventListener('click', () => {
      document.getElementById('mealTime').value = new Date().toTimeString().slice(0,5);
      document.getElementById('geminiScanStatus').classList.add('hidden');
    });
    document.getElementById('openWorkoutModalBtn').addEventListener('click', () => {
      document.getElementById('workoutTime').value = new Date().toTimeString().slice(0,5);
    });

    // GEMINI PHOTO SCANNER LOGIC
    const mealPhotoInput = document.getElementById('mealPhotoInput');
    const scanStatus = document.getElementById('geminiScanStatus');

    mealPhotoInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const apiKey = settings.geminiApiKey;
      if (!apiKey) {
        alert("Please tap the ⚙️ Settings icon and enter your Gemini API Key first!");
        return;
      }

      scanStatus.classList.remove('hidden', 'text-rose-400', 'text-emerald-400');
      scanStatus.classList.add('text-slate-400');
      scanStatus.textContent = "Analyzing meal with Gemini...";

      try {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = async () => {
          const base64Data = reader.result.split(',')[1];
          const mimeType = file.type || 'image/jpeg';

          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{
                parts: [
                  {
                    text: "You are a clinical sports dietitian. Analyze the food in this image. Estimate the realistic total calories (kcal) and total protein (grams) for the depicted portion. Return ONLY valid, raw JSON (no markdown fences, no extra text) with this exact structure: {\"food\": \"concise description of food items\", \"calories\": 450, \"protein\": 30, \"mealType\": \"Breakfast\" or \"Lunch\" or \"Dinner\" or \"Snack\"}"
                  },
                  {
                    inlineData: {
                      mimeType: mimeType,
                      data: base64Data
                    }
                  }
                ]
              }]
            })
          });

          if (!response.ok) {
            throw new Error(`API error: ${response.statusText}`);
          }

          const resData = await response.json();
          let textResult = resData.candidates[0].content.parts[0].text.trim();
          textResult = textResult.replace(/^```json\s*/i, '').replace(/```$/i, '').trim();
          const parsed = JSON.parse(textResult);

          if (parsed.food) document.getElementById('mealFood').value = parsed.food;
          if (parsed.calories) document.getElementById('mealCalories').value = parsed.calories;
          if (parsed.protein) document.getElementById('mealProtein').value = parsed.protein;
          if (parsed.mealType) document.getElementById('mealType').value = parsed.mealType;

          scanStatus.classList.remove('text-slate-400');
          scanStatus.classList.add('text-emerald-400');
          scanStatus.textContent = "✓ Scan complete! Review and adjust values below if needed.";
        };
      } catch (err) {
        console.error(err);
        scanStatus.classList.remove('text-slate-400');
        scanStatus.classList.add('text-rose-400');
        scanStatus.textContent = "Analysis failed. Please check your Gemini API key in settings.";
      }
    });

    // Handle Meal Submission
    document.getElementById('mealForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const rec = ensureDateRecord(selectedDate);
      rec.meals.push({
        id: Date.now().toString(),
        type: document.getElementById('mealType').value,
        time: document.getElementById('mealTime').value,
        calories: Number(document.getElementById('mealCalories').value) || 0,
        protein: Number(document.getElementById('mealProtein').value) || 0,
        food: document.getElementById('mealFood').value.trim(),
        brand: document.getElementById('mealBrand').value.trim(),
        restaurant: document.getElementById('mealRestaurant').value.trim()
      });
      saveAppData();
      document.getElementById('mealModal').classList.add('hidden');
      e.target.reset();
      scanStatus.classList.add('hidden');
    });

    // Handle Workout Submission
    document.getElementById('workoutForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const rec = ensureDateRecord(selectedDate);
      const category = document.getElementById('workoutType').value;
      const duration = Number(document.getElementById('workoutDuration').value) || 0;

      let burn = duration * settings.otherKcalPerMin;
      if (category === 'Strength Training') burn = duration * settings.strengthKcalPerMin;
      if (category === 'Swimming') burn = duration * settings.swimKcalPerMin;

      rec.workouts.push({
        id: Date.now().toString(),
        type: category,
        time: document.getElementById('workoutTime').value,
        duration: duration,
        burn: Math.round(burn),
        notes: document.getElementById('workoutNotes').value.trim()
      });
      saveAppData();
      document.getElementById('workoutModal').classList.add('hidden');
      e.target.reset();
    });

    // Handle Metrics Submission
    document.getElementById('metricsForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const rec = ensureDateRecord(selectedDate);
      const w = document.getElementById('inputWeight').value;
      const f = document.getElementById('inputFat').value;
      const m = document.getElementById('inputMuscle').value;
      const s = document.getElementById('inputSteps').value;

      if (w !== "") rec.metrics.weight = Number(w);
      if (f !== "") rec.metrics.fat = Number(f);
      if (m !== "") rec.metrics.muscle = Number(m);
      if (s !== "") rec.metrics.steps = Number(s);

      saveAppData();
      document.getElementById('metricsModal').classList.add('hidden');
    });

    // Handle Settings Submission
    document.getElementById('settingsForm').addEventListener('submit', (e) => {
      e.preventDefault();
      settings.geminiApiKey = document.getElementById('settingGeminiKey').value.trim();
      settings.mode = document.getElementById('settingMode').value;
      settings.bmr = Number(document.getElementById('settingBMR').value) || 1612;
      settings.stepFactor = Number(document.getElementById('settingStepFactor').value) || 0.044;
      settings.proteinGoal = Number(document.getElementById('settingProteinGoal').value) || 150;
      settings.fixedBudget = Number(document.getElementById('settingFixedBudget').value) || 1900;
      saveAppData();
      document.getElementById('settingsModal').classList.add('hidden');
    });

    // Render View Function
    function renderCurrentDateView() {
      const rec = ensureDateRecord(selectedDate);

      // Populate Settings & Metrics Inputs
      document.getElementById('settingGeminiKey').value = settings.geminiApiKey || "";
      document.getElementById('inputWeight').value = rec.metrics.weight || "";
      document.getElementById('inputFat').value = rec.metrics.fat || "";
      document.getElementById('inputMuscle').value = rec.metrics.muscle || "";
      document.getElementById('inputSteps').value = rec.metrics.steps || 0;

      document.getElementById('settingMode').value = settings.mode;
      document.getElementById('settingBMR').value = settings.bmr;
      document.getElementById('settingStepFactor').value = settings.stepFactor;
      document.getElementById('settingProteinGoal').value = settings.proteinGoal;
      document.getElementById('settingFixedBudget').value = settings.fixedBudget;

      // Metrics strip
      document.getElementById('metricWeight').textContent = rec.metrics.weight ? `${rec.metrics.weight}kg` : '--';
      document.getElementById('metricFat').textContent = rec.metrics.fat ? `${rec.metrics.fat}%` : '--';
      document.getElementById('metricMuscle').textContent = rec.metrics.muscle ? `${rec.metrics.muscle}%` : '--';
      document.getElementById('metricSteps').textContent = (rec.metrics.steps || 0).toLocaleString();
      document.getElementById('exerciseTabStepsDisplay').textContent = (rec.metrics.steps || 0).toLocaleString();

      // Meal sums
      let totalCalories = 0;
      let totalProtein = 0;
      rec.meals.forEach(m => {
        totalCalories += m.calories || 0;
        totalProtein += m.protein || 0;
      });

      // Workout sums
      let totalWorkoutBurn = 0;
      rec.workouts.forEach(w => {
        totalWorkoutBurn += w.burn || 0;
      });

      // Protein progress bar
      document.getElementById('proteinSummaryText').textContent = `${totalProtein} / ${settings.proteinGoal}g`;
      const proteinPct = Math.min(100, Math.round((totalProtein / settings.proteinGoal) * 100));
      document.getElementById('proteinProgressBar').style.width = `${proteinPct}%`;

      // Balance card calculations
      const balanceCard = document.getElementById('balanceCard');
      const balanceValue = document.getElementById('balanceValue');
      const balanceBadge = document.getElementById('balanceBadge');
      const totalBurnLabel = document.getElementById('totalBurnLabel');
      const totalIntakeLabel = document.getElementById('totalIntakeLabel');
      const balanceModeLabel = document.getElementById('balanceModeLabel');

      totalIntakeLabel.textContent = `${totalCalories.toLocaleString()} kcal`;

      if (settings.mode === 'dynamic') {
        balanceModeLabel.textContent = "Dynamic Net Balance";
        const stepBurn = Math.round((rec.metrics.steps || 0) * settings.stepFactor);
        const totalBurn = settings.bmr + stepBurn + totalWorkoutBurn;
        totalBurnLabel.textContent = `${totalBurn.toLocaleString()} kcal`;

        // Net Balance: Intake minus Burned
        const net = totalCalories - totalBurn;
        if (net <= 0) {
          balanceCard.className = "rounded-2xl p-5 border bg-emerald-950/40 border-emerald-500/40 text-emerald-100";
          balanceBadge.className = "text-xs px-2.5 py-1 rounded-full font-bold uppercase bg-emerald-500/20 text-emerald-400 border border-emerald-500/40";
          balanceBadge.textContent = "Deficit";
          balanceValue.textContent = `${net.toLocaleString()}`;
        } else {
          balanceCard.className = "rounded-2xl p-5 border bg-rose-950/40 border-rose-500/40 text-rose-100";
          balanceBadge.className = "text-xs px-2.5 py-1 rounded-full font-bold uppercase bg-rose-500/20 text-rose-400 border border-rose-500/40";
          balanceBadge.textContent = "Surplus";
          balanceValue.textContent = `+${net.toLocaleString()}`;
        }
      } else {
        balanceModeLabel.textContent = "Fixed Budget Balance";
        totalBurnLabel.textContent = `${settings.fixedBudget.toLocaleString()} kcal (Cap)`;
        const remaining = settings.fixedBudget - totalCalories;
        if (remaining >= 0) {
          balanceCard.className = "rounded-2xl p-5 border bg-emerald-950/40 border-emerald-500/40 text-emerald-100";
          balanceBadge.className = "text-xs px-2.5 py-1 rounded-full font-bold uppercase bg-emerald-500/20 text-emerald-400 border border-emerald-500/40";
          balanceBadge.textContent = "Under Budget";
          balanceValue.textContent = `${remaining.toLocaleString()} left`;
        } else {
          balanceCard.className = "rounded-2xl p-5 border bg-rose-950/40 border-rose-500/40 text-rose-100";
          balanceBadge.className = "text-xs px-2.5 py-1 rounded-full font-bold uppercase bg-rose-500/20 text-rose-400 border border-rose-500/40";
          balanceBadge.textContent = "Over Budget";
          balanceValue.textContent = `${Math.abs(remaining).toLocaleString()} over`;
        }
      }

      // Render meals chronologically
      const mealsList = document.getElementById('mealsList');
      mealsList.innerHTML = '';
      document.getElementById('mealsSummarySubtext').textContent = `${totalCalories.toLocaleString()} kcal · ${totalProtein}g Protein`;

      if (rec.meals.length === 0) {
        mealsList.innerHTML = `<p class="text-xs text-slate-500 text-center py-8">No meals logged for this date.</p>`;
      } else {
        const sortedMeals = [...rec.meals].sort((a, b) => (a.time || '').localeCompare(b.time || ''));
        sortedMeals.forEach((m) => {
          const originalIndex = rec.meals.findIndex(item => item.id === m.id);
          const item = document.createElement('div');
          item.className = "bg-slate-800/80 p-3.5 rounded-xl border border-slate-700/60 flex items-start justify-between";
          item.innerHTML = `
            <div>
              <div class="flex items-center gap-2">
                <span class="text-xs font-bold text-emerald-400 uppercase tracking-wide">${m.type}</span>
                <span class="text-[10px] text-slate-500">${m.time}</span>
              </div>
              <p class="text-sm font-semibold text-slate-200 mt-0.5">${m.food || 'Meal'}</p>
              <div class="flex flex-wrap gap-1.5 mt-1">
                ${m.restaurant ? `<span class="text-[10px] bg-slate-900 px-2 py-0.5 rounded text-slate-400">📍 ${m.restaurant}</span>` : ''}
                ${m.brand ? `<span class="text-[10px] bg-slate-900 px-2 py-0.5 rounded text-slate-400">🏷️ ${m.brand}</span>` : ''}
              </div>
            </div>
            <div class="text-right">
              <span class="text-sm font-black text-slate-200">${m.calories} <span class="text-[10px] font-normal text-slate-400">kcal</span></span>
              <span class="text-xs text-emerald-400 block">${m.protein}g P</span>
              <button data-action="delete-meal" data-index="${originalIndex}" class="text-[10px] text-slate-500 hover:text-rose-400 mt-1">Delete</button>
            </div>
          `;
          mealsList.appendChild(item);
        });
      }

      // Render workouts
      const workoutsList = document.getElementById('workoutsList');
      workoutsList.innerHTML = '';
      document.getElementById('workoutSummarySubtext').textContent = `${rec.workouts.length} workouts · ${totalWorkoutBurn} kcal burned`;

      if (rec.workouts.length === 0) {
        workoutsList.innerHTML = `<p class="text-xs text-slate-500 text-center py-8">No workouts logged for this date.</p>`;
      } else {
        rec.workouts.forEach((w, idx) => {
          const item = document.createElement('div');
          item.className = "bg-slate-800/80 p-3.5 rounded-xl border border-slate-700/60 flex items-start justify-between";
          item.innerHTML = `
            <div>
              <div class="flex items-center gap-2">
                <span class="text-xs font-bold text-sky-400 uppercase tracking-wide">${w.type}</span>
                <span class="text-[10px] text-slate-500">${w.time} (${w.duration}m)</span>
              </div>
              ${w.notes ? `<p class="text-xs text-slate-300 mt-1.5 whitespace-pre-line bg-slate-900/60 p-2 rounded-lg border border-slate-800">${w.notes}</p>` : ''}
            </div>
            <div class="text-right pl-3">
              <span class="text-sm font-black text-sky-300">${w.burn} <span class="text-[10px] font-normal text-slate-400">kcal</span></span>
              <button data-action="delete-workout" data-index="${idx}" class="text-[10px] text-slate-500 hover:text-rose-400 block mt-1">Delete</button>
            </div>
          `;
          workoutsList.appendChild(item);
        });
      }
    }

    // Event Delegation for Delete actions
    document.addEventListener('click', (e) => {
      if (e.target.dataset.action === 'delete-meal') {
        const index = Number(e.target.dataset.index);
        appData[selectedDate].meals.splice(index, 1);
        saveAppData();
      }
      if (e.target.dataset.action === 'delete-workout') {
        const index = Number(e.target.dataset.index);
        appData[selectedDate].workouts.splice(index, 1);
        saveAppData();
      }
    });

    renderCurrentDateView();
  </script>
</body>
</html>
